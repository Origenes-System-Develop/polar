<svg xmlns="http://www.w3.org/2000/svg" width="1218" height="240" viewBox="0 0 1218 240" role="img" aria-label="Fluxo da ocorrência: o professor registra, a coordenação analisa e resolve, a direção encerra">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
  .e0{animation:luz0 12s infinite} @keyframes luz0{0%,0%{opacity:.45}0%,24%{opacity:1}25%,100%{opacity:.45}} .r0{animation:anel0 12s infinite} @keyframes anel0{0%,0%{stroke-opacity:0}0%,24%{stroke-opacity:1}25%,100%{stroke-opacity:0}} .e1{animation:luz1 12s infinite} @keyframes luz1{0%,24.99%{opacity:.45}25%,49%{opacity:1}50%,100%{opacity:.45}} .r1{animation:anel1 12s infinite} @keyframes anel1{0%,24.99%{stroke-opacity:0}25%,49%{stroke-opacity:1}50%,100%{stroke-opacity:0}} .e2{animation:luz2 12s infinite} @keyframes luz2{0%,49.99%{opacity:.45}50%,74%{opacity:1}75%,100%{opacity:.45}} .r2{animation:anel2 12s infinite} @keyframes anel2{0%,49.99%{stroke-opacity:0}50%,74%{stroke-opacity:1}75%,100%{stroke-opacity:0}} .e3{animation:luz3 12s infinite} @keyframes luz3{0%,74.99%{opacity:.45}75%,99%{opacity:1}100%,100%{opacity:.45}} .r3{animation:anel3 12s infinite} @keyframes anel3{0%,74.99%{stroke-opacity:0}75%,99%{stroke-opacity:1}100%,100%{stroke-opacity:0}}
  .barra{transform-origin:left;animation:enche 12s linear infinite} @keyframes enche{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect x=".5" y=".5" width="1217" height="239" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="30" font-size="14" font-weight="600" fill="#656d76">UMA OCORRÊNCIA, QUATRO ESTADOS, TRÊS TRANSIÇÕES</text>
<g class="e0">
  <rect x="40" y="46" width="250" height="150" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <rect class="r0" x="40" y="46" width="250" height="150" rx="12" fill="none" stroke="#0969da" stroke-width="2"/>
  <text x="62" y="82" font-size="13" fill="#656d76">1. Professor</text>
  <text x="62" y="112" font-size="24" font-weight="700" fill="#1f2328">Registra</text>
  <rect x="62" y="138" width="130" height="30" rx="15" fill="#ddf4ff" stroke="#0969da" stroke-opacity=".4"/>
  <text x="127" y="158" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0969da">REGISTRADA</text>
</g><path d="M296 121 h34 m-7 -6 l7 6 l-7 6" fill="none" stroke="#656d76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="e1">
  <rect x="336" y="46" width="250" height="150" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <rect class="r1" x="336" y="46" width="250" height="150" rx="12" fill="none" stroke="#9a6700" stroke-width="2"/>
  <text x="358" y="82" font-size="13" fill="#656d76">2. Coordenação</text>
  <text x="358" y="112" font-size="24" font-weight="700" fill="#1f2328">Analisa</text>
  <rect x="358" y="138" width="130" height="30" rx="15" fill="#fff8c5" stroke="#9a6700" stroke-opacity=".4"/>
  <text x="423" y="158" font-size="12.5" font-weight="600" text-anchor="middle" fill="#9a6700">EM ANÁLISE</text>
</g><path d="M592 121 h34 m-7 -6 l7 6 l-7 6" fill="none" stroke="#656d76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="e2">
  <rect x="632" y="46" width="250" height="150" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <rect class="r2" x="632" y="46" width="250" height="150" rx="12" fill="none" stroke="#1a7f37" stroke-width="2"/>
  <text x="654" y="82" font-size="13" fill="#656d76">3. Coordenação</text>
  <text x="654" y="112" font-size="24" font-weight="700" fill="#1f2328">Resolve</text>
  <rect x="654" y="138" width="130" height="30" rx="15" fill="#dafbe1" stroke="#1a7f37" stroke-opacity=".4"/>
  <text x="719" y="158" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1a7f37">RESOLVIDA</text>
</g><path d="M888 121 h34 m-7 -6 l7 6 l-7 6" fill="none" stroke="#656d76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="e3">
  <rect x="928" y="46" width="250" height="150" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <rect class="r3" x="928" y="46" width="250" height="150" rx="12" fill="none" stroke="#8250df" stroke-width="2"/>
  <text x="950" y="82" font-size="13" fill="#656d76">4. Direção</text>
  <text x="950" y="112" font-size="24" font-weight="700" fill="#1f2328">Encerra</text>
  <rect x="950" y="138" width="130" height="30" rx="15" fill="#fbefff" stroke="#8250df" stroke-opacity=".4"/>
  <text x="1015" y="158" font-size="12.5" font-weight="600" text-anchor="middle" fill="#8250df">ENCERRADA</text>
</g>
<rect x="40" y="216" width="1138" height="4" rx="2" fill="#d0d7de"/>
<rect class="barra" x="40" y="216" width="1138" height="4" rx="2" fill="#0969da"/>
</svg>
