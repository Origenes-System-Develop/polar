<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="494" viewBox="0 0 1000 494" role="img" aria-label="Regras que não mudam: quatro estados e três transições, histórico que só cresce, nada é apagado, o servidor decide a permissão."><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.l{animation:entra .6s both}@keyframes entra{from{opacity:0;transform:translateX(-8px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style><rect x="0.5" y="0.5" width="999" height="485" rx="8" fill="#0d1117" stroke="#30363d" /><path d="M0.5 46V8.5a8 8 0 0 1 8-8H991.5a8 8 0 0 1 8 8V46z" fill="#161b22" stroke="#30363d"/><text x="20" y="29" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >#</text><text x="110" y="29" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Regra</text><g class="l" style="animation-delay:0.00s"><line x1="0.5" x2="999.5" y1="46" y2="46" stroke="#30363d"/><text x="20" y="73.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="start" >1</text><text x="110" y="73.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Só existem 4 estados e 3 transições, cada uma de um papel. Pular etapa dá erro 409.</text></g><g class="l" style="animation-delay:0.07s"><line x1="0.5" x2="999.5" y1="90" y2="90" stroke="#30363d"/><rect x="1" y="91" width="998" height="43" fill="#161b22" opacity=".6"/><text x="20" y="117.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="start" >2</text><text x="110" y="117.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Professor não muda status e só vê as próprias ocorrências.</text></g><g class="l" style="animation-delay:0.14s"><line x1="0.5" x2="999.5" y1="134" y2="134" stroke="#30363d"/><text x="20" y="161.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="start" >3</text><text x="110" y="161.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Editar: só o autor, só em REGISTRADA, sempre com histórico.</text></g><g class="l" style="animation-delay:0.21s"><line x1="0.5" x2="999.5" y1="178" y2="178" stroke="#30363d"/><rect x="1" y="179" width="998" height="43" fill="#161b22" opacity=".6"/><text x="20" y="205.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="start" >4</text><text x="110" y="205.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >O histórico só cresce. Tentativa de editar devolve 405.</text></g><g class="l" style="animation-delay:0.28s"><line x1="0.5" x2="999.5" y1="222" y2="222" stroke="#30363d"/><text x="20" y="249.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="start" >5</text><text x="110" y="249.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Ocorrência ENCERRADA é somente leitura, para sempre.</text></g><g class="l" style="animation-delay:0.35s"><line x1="0.5" x2="999.5" y1="266" y2="266" stroke="#30363d"/><rect x="1" y="267" width="998" height="43" fill="#161b22" opacity=".6"/><text x="20" y="293.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="start" >6</text><text x="110" y="293.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Nada é apagado de verdade: alunos, turmas e usuários são inativados.</text></g><g class="l" style="animation-delay:0.42s"><line x1="0.5" x2="999.5" y1="310" y2="310" stroke="#30363d"/><text x="20" y="337.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="start" >7</text><text x="110" y="337.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Autor e data vêm do servidor, nunca do formulário.</text></g><g class="l" style="animation-delay:0.49s"><line x1="0.5" x2="999.5" y1="354" y2="354" stroke="#30363d"/><rect x="1" y="355" width="998" height="43" fill="#161b22" opacity=".6"/><text x="20" y="381.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="start" >8</text><text x="110" y="381.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >O servidor é a única autoridade de permissão.</text></g><g class="l" style="animation-delay:0.56s"><line x1="0.5" x2="999.5" y1="398" y2="398" stroke="#30363d"/><text x="20" y="425.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="start" >9</text><text x="110" y="425.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Aluno nunca é usuário do sistema.</text></g><g class="l" style="animation-delay:0.63s"><line x1="0.5" x2="999.5" y1="442" y2="442" stroke="#30363d"/><rect x="1" y="443" width="998" height="43" fill="#161b22" opacity=".6"/><text x="20" y="469.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="start" >10</text><text x="110" y="469.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Acentuação em português é válida em todo lugar, inclusive no login.</text></g></svg>