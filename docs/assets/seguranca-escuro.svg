<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="376" viewBox="0 0 1000 376" role="img" aria-label="Segurança: senhas com bcrypt, sessão com JWT, permissão decidida no servidor, entrada validada com Zod, consultas parametrizadas, avatar validado, helmet e CodeQL."><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.l{animation:entra .6s both}@keyframes entra{from{opacity:0;transform:translateX(-8px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style><rect x="0.5" y="0.5" width="999" height="367" rx="8" fill="#0d1117" stroke="#30363d" /><path d="M0.5 46V8.5a8 8 0 0 1 8-8H991.5a8 8 0 0 1 8 8V46z" fill="#161b22" stroke="#30363d"/><text x="20" y="29" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Medida</text><text x="230" y="29" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Como</text><g class="l" style="animation-delay:0.00s"><line x1="0.5" x2="999.5" y1="46" y2="46" stroke="#30363d"/><text x="20" y="74.0" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Senhas</text><text x="230" y="74.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >bcrypt. Nenhuma resposta devolve o hash. A senha temporária vale até o primeiro acesso.</text></g><g class="l" style="animation-delay:0.07s"><line x1="0.5" x2="999.5" y1="92" y2="92" stroke="#30363d"/><rect x="1" y="93" width="998" height="45" fill="#161b22" opacity=".6"/><text x="20" y="120.0" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Sessão</text><text x="230" y="120.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >JWT com validade. 5 tentativas erradas bloqueiam o usuário por 15 minutos.</text></g><g class="l" style="animation-delay:0.14s"><line x1="0.5" x2="999.5" y1="138" y2="138" stroke="#30363d"/><text x="20" y="166.0" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Permissão</text><text x="230" y="166.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Decidida no servidor, em toda rota. A tela só esconde, nunca autoriza.</text></g><g class="l" style="animation-delay:0.21s"><line x1="0.5" x2="999.5" y1="184" y2="184" stroke="#30363d"/><rect x="1" y="185" width="998" height="45" fill="#161b22" opacity=".6"/><text x="20" y="212.0" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Entrada</text><text x="230" y="212.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Zod em todos os endpoints. HTML e caracteres de controle são recusados.</text></g><g class="l" style="animation-delay:0.28s"><line x1="0.5" x2="999.5" y1="230" y2="230" stroke="#30363d"/><text x="20" y="258.0" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Banco</text><text x="230" y="258.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Consultas 100% parametrizadas.</text></g><g class="l" style="animation-delay:0.35s"><line x1="0.5" x2="999.5" y1="276" y2="276" stroke="#30363d"/><rect x="1" y="277" width="998" height="45" fill="#161b22" opacity=".6"/><text x="20" y="304.0" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Avatar</text><text x="230" y="304.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >O SVG é validado no servidor (sem script, sem imagem externa).</text></g><g class="l" style="animation-delay:0.42s"><line x1="0.5" x2="999.5" y1="322" y2="322" stroke="#30363d"/><text x="20" y="350.0" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Cabeçalhos e código</text><text x="230" y="350.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >helmet com CSP, e CodeQL do GitHub em todo pull request.</text></g></svg>