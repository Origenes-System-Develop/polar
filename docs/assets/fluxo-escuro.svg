<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Fluxo: registrada, em análise, resolvida e encerrada. Cada passo é de um papel."><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.fio{stroke-dasharray:6 6;animation:flui 1.4s linear infinite}
@keyframes flui{to{stroke-dashoffset:-12}}
.pulso{transform-box:fill-box;transform-origin:center;animation:pulso 3.2s ease-in-out infinite}
@keyframes pulso{50%{transform:scale(1.05)}}
.viaja{animation:viaja 7s linear infinite}
@keyframes viaja{0%{transform:translateX(-80px);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(815px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style><rect x="0" y="0" width="1000" height="220" rx="14" fill="#0d1117" /><line class="fio" x1="211" x2="264" y1="110" y2="110" stroke="#30363d" stroke-width="2"/><path d="M258 104l8 6-8 6" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line class="fio" x1="456" x2="509" y1="110" y2="110" stroke="#30363d" stroke-width="2"/><path d="M503 104l8 6-8 6" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line class="fio" x1="701" x2="754" y1="110" y2="110" stroke="#30363d" stroke-width="2"/><path d="M748 104l8 6-8 6" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="viaja" cx="117" cy="110" r="6" fill="#2f81f7"/><rect x="30" y="78" width="175" height="64" rx="12" fill="#0d2447" stroke="#2f81f7" /><text x="117" y="116" font-size="15" font-weight="800" fill="#2f81f7" text-anchor="middle" >REGISTRADA</text><text x="117" y="56" font-size="14" font-weight="600" fill="#8b949e" text-anchor="middle" >Professor registra</text><text x="117" y="172" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle" >passo 1 de 4</text><rect x="275" y="78" width="175" height="64" rx="12" fill="#3a2c0a" stroke="#d29922" /><text x="362" y="116" font-size="15" font-weight="800" fill="#d29922" text-anchor="middle" >EM ANÁLISE</text><text x="362" y="56" font-size="14" font-weight="600" fill="#8b949e" text-anchor="middle" >Coordenação analisa</text><text x="362" y="172" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle" >passo 2 de 4</text><rect x="520" y="78" width="175" height="64" rx="12" fill="#0f2d1a" stroke="#3fb950" /><text x="607" y="116" font-size="15" font-weight="800" fill="#3fb950" text-anchor="middle" >RESOLVIDA</text><text x="607" y="56" font-size="14" font-weight="600" fill="#8b949e" text-anchor="middle" >Coordenação resolve</text><text x="607" y="172" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle" >passo 3 de 4</text><rect x="765" y="78" width="175" height="64" rx="12" fill="#2a1f4a" stroke="#a371f7" /><text x="852" y="116" font-size="15" font-weight="800" fill="#a371f7" text-anchor="middle" >ENCERRADA</text><text x="852" y="56" font-size="14" font-weight="600" fill="#8b949e" text-anchor="middle" >Direção encerra</text><text x="852" y="172" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle" >somente leitura</text></svg>