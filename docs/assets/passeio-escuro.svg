<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="422" viewBox="0 0 1000 422" role="img" aria-label="As 8 telas do passeio: entrada, início, registro, pendências, resolução, encerramento, histórico e relatórios."><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.l{animation:entra .6s both}@keyframes entra{from{opacity:0;transform:translateX(-8px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style><rect x="0.5" y="0.5" width="999" height="413" rx="8" fill="#0d1117" stroke="#30363d" /><path d="M0.5 46V8.5a8 8 0 0 1 8-8H991.5a8 8 0 0 1 8 8V46z" fill="#161b22" stroke="#30363d"/><text x="40.0" y="29" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle" >#</text><text x="100" y="29" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Tela</text><text x="300" y="29" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >O que você vê</text><g class="l" style="animation-delay:0.00s"><line x1="0.5" x2="999.5" y1="46" y2="46" stroke="#30363d"/><text x="40.0" y="74.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="middle" >1</text><text x="100" y="74.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Entrada</text><text x="300" y="74.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >O professor entra com o e-mail da escola.</text></g><g class="l" style="animation-delay:0.07s"><line x1="0.5" x2="999.5" y1="92" y2="92" stroke="#30363d"/><rect x="1" y="93" width="998" height="45" fill="#161b22" opacity=".6"/><text x="40.0" y="120.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="middle" >2</text><text x="100" y="120.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Início</text><text x="300" y="120.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >O painel do dia: números, últimas ocorrências e o aviso de pendências.</text></g><g class="l" style="animation-delay:0.14s"><line x1="0.5" x2="999.5" y1="138" y2="138" stroke="#30363d"/><text x="40.0" y="166.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="middle" >3</text><text x="100" y="166.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Registro</text><text x="300" y="166.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Aluno, categoria, gravidade e relato numa tela só. O aviso confirma.</text></g><g class="l" style="animation-delay:0.21s"><line x1="0.5" x2="999.5" y1="184" y2="184" stroke="#30363d"/><rect x="1" y="185" width="998" height="45" fill="#161b22" opacity=".6"/><text x="40.0" y="212.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="middle" >4</text><text x="100" y="212.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Pendências</text><text x="300" y="212.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >A fila chega em ordem de urgência, e a primeira vem marcada.</text></g><g class="l" style="animation-delay:0.28s"><line x1="0.5" x2="999.5" y1="230" y2="230" stroke="#30363d"/><text x="40.0" y="258.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="middle" >5</text><text x="100" y="258.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Resolução</text><text x="300" y="258.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >A coordenação analisa, escreve a observação e marca como resolvida.</text></g><g class="l" style="animation-delay:0.35s"><line x1="0.5" x2="999.5" y1="276" y2="276" stroke="#30363d"/><rect x="1" y="277" width="998" height="45" fill="#161b22" opacity=".6"/><text x="40.0" y="304.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="middle" >6</text><text x="100" y="304.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Encerramento</text><text x="300" y="304.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >A direção encerra. Dali em diante a ocorrência é só leitura.</text></g><g class="l" style="animation-delay:0.42s"><line x1="0.5" x2="999.5" y1="322" y2="322" stroke="#30363d"/><text x="40.0" y="350.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="middle" >7</text><text x="100" y="350.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Histórico</text><text x="300" y="350.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Cada passo, com autor, data e hora. Ninguém edita nem apaga.</text></g><g class="l" style="animation-delay:0.49s"><line x1="0.5" x2="999.5" y1="368" y2="368" stroke="#30363d"/><rect x="1" y="369" width="998" height="45" fill="#161b22" opacity=".6"/><text x="40.0" y="396.0" font-size="16" font-weight="700" fill="#2f81f7" text-anchor="middle" >8</text><text x="100" y="396.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Relatórios</text><text x="300" y="396.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >Gráficos do ano e planilha do Excel para baixar.</text></g></svg>