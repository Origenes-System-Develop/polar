<svg xmlns="http://www.w3.org/2000/svg" width="1218" height="240" viewBox="0 0 1218 240" role="img" aria-label="Fluxo da ocorrência: o professor registra, a coordenação analisa e resolve, a direção encerra">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
  .e0{animation:luz0 12s infinite} @keyframes luz0{0%,0%{opacity:.45}0%,24%{opacity:1}25%,100%{opacity:.45}} .r0{animation:anel0 12s infinite} @keyframes anel0{0%,0%{stroke-opacity:0}0%,24%{stroke-opacity:1}25%,100%{stroke-opacity:0}} .e1{animation:luz1 12s infinite} @keyframes luz1{0%,24.99%{opacity:.45}25%,49%{opacity:1}50%,100%{opacity:.45}} .r1{animation:anel1 12s infinite} @keyframes anel1{0%,24.99%{stroke-opacity:0}25%,49%{stroke-opacity:1}50%,100%{stroke-opacity:0}} .e2{animation:luz2 12s infinite} @keyframes luz2{0%,49.99%{opacity:.45}50%,74%{opacity:1}75%,100%{opacity:.45}} .r2{animation:anel2 12s infinite} @keyframes anel2{0%,49.99%{stroke-opacity:0}50%,74%{stroke-opacity:1}75%,100%{stroke-opacity:0}} .e3{animation:luz3 12s infinite} @keyframes luz3{0%,74.99%{opacity:.45}75%,99%{opacity:1}100%,100%{opacity:.45}} .r3{animation:anel3 12s infinite} @keyframes anel3{0%,74.99%{stroke-opacity:0}75%,99%{stroke-opacity:1}100%,100%{stroke-opacity:0}}
  .barra{transform-origin:left;animation:enche 12s linear infinite} @keyframes enche{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect x=".5" y=".5" width="1217" height="239" rx="14" fill="#0d1117" stroke="#30363d"/>
<text x="40" y="30" font-size="14" font-weight="600" fill="#848d97">UMA OCORRÊNCIA, QUATRO ESTADOS, TRÊS TRANSIÇÕES</text>
<g class="e0">
  <rect x="40" y="46" width="250" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect class="r0" x="40" y="46" width="250" height="150" rx="12" fill="none" stroke="#2f81f7" stroke-width="2"/>
  <text x="62" y="82" font-size="13" fill="#848d97">1. Professor</text>
  <text x="62" y="112" font-size="24" font-weight="700" fill="#e6edf3">Registra</text>
  <rect x="62" y="138" width="130" height="30" rx="15" fill="#0d2240" stroke="#2f81f7" stroke-opacity=".4"/>
  <text x="127" y="158" font-size="12.5" font-weight="600" text-anchor="middle" fill="#2f81f7">REGISTRADA</text>
</g><path d="M296 121 h34 m-7 -6 l7 6 l-7 6" fill="none" stroke="#848d97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="e1">
  <rect x="336" y="46" width="250" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect class="r1" x="336" y="46" width="250" height="150" rx="12" fill="none" stroke="#d29922" stroke-width="2"/>
  <text x="358" y="82" font-size="13" fill="#848d97">2. Coordenação</text>
  <text x="358" y="112" font-size="24" font-weight="700" fill="#e6edf3">Analisa</text>
  <rect x="358" y="138" width="130" height="30" rx="15" fill="#3a2a06" stroke="#d29922" stroke-opacity=".4"/>
  <text x="423" y="158" font-size="12.5" font-weight="600" text-anchor="middle" fill="#d29922">EM ANÁLISE</text>
</g><path d="M592 121 h34 m-7 -6 l7 6 l-7 6" fill="none" stroke="#848d97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="e2">
  <rect x="632" y="46" width="250" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect class="r2" x="632" y="46" width="250" height="150" rx="12" fill="none" stroke="#3fb950" stroke-width="2"/>
  <text x="654" y="82" font-size="13" fill="#848d97">3. Coordenação</text>
  <text x="654" y="112" font-size="24" font-weight="700" fill="#e6edf3">Resolve</text>
  <rect x="654" y="138" width="130" height="30" rx="15" fill="#0f2d1a" stroke="#3fb950" stroke-opacity=".4"/>
  <text x="719" y="158" font-size="12.5" font-weight="600" text-anchor="middle" fill="#3fb950">RESOLVIDA</text>
</g><path d="M888 121 h34 m-7 -6 l7 6 l-7 6" fill="none" stroke="#848d97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="e3">
  <rect x="928" y="46" width="250" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect class="r3" x="928" y="46" width="250" height="150" rx="12" fill="none" stroke="#a371f7" stroke-width="2"/>
  <text x="950" y="82" font-size="13" fill="#848d97">4. Direção</text>
  <text x="950" y="112" font-size="24" font-weight="700" fill="#e6edf3">Encerra</text>
  <rect x="950" y="138" width="130" height="30" rx="15" fill="#271a45" stroke="#a371f7" stroke-opacity=".4"/>
  <text x="1015" y="158" font-size="12.5" font-weight="600" text-anchor="middle" fill="#a371f7">ENCERRADA</text>
</g>
<rect x="40" y="216" width="1138" height="4" rx="2" fill="#30363d"/>
<rect class="barra" x="40" y="216" width="1138" height="4" rx="2" fill="#2f81f7"/>
</svg>
