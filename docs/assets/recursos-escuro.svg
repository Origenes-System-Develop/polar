<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="O que o Polar faz: fluxo fechado, histórico que não se apaga, cada um vê o seu, pendências em ordem, relatórios, estúdio de avatar, auditoria e custo zero."><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.c{animation:entra .7s both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}}
.c:hover{}
.lampada{transform-box:fill-box;transform-origin:center;animation:resp 5s ease-in-out infinite}
@keyframes resp{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style><g class="c" style="animation-delay:0.00s"><rect x="8" y="12" width="236" height="210" rx="12" fill="#161b22" stroke="#30363d" /><circle class="lampada" cx="46" cy="58" r="22" fill="#0d2447" style="animation-delay:0.0s"/><g transform="translate(34 46)"><path d="M4 7h5l3 3-3 3H4zM15 10h5M12 17l3-3-3-3" fill="none" stroke="#2f81f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="26" y="112" font-size="15.5" font-weight="700" fill="#e6edf3" text-anchor="start" >Fluxo fechado</text><text x="26" y="138" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >4 estados e 3 transições,</text><text x="26" y="159" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >cada uma de um papel.</text><text x="26" y="180" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >Pular etapa dá erro 409.</text></g><g class="c" style="animation-delay:0.08s"><rect x="255" y="12" width="236" height="210" rx="12" fill="#161b22" stroke="#30363d" /><circle class="lampada" cx="293" cy="58" r="22" fill="#0d2447" style="animation-delay:0.4s"/><g transform="translate(281 46)"><path d="M12 7v5l3 2M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4" fill="none" stroke="#2f81f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="273" y="112" font-size="15.5" font-weight="700" fill="#e6edf3" text-anchor="start" >Histórico que não se apaga</text><text x="273" y="138" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >Toda ação grava um registro.</text><text x="273" y="159" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >Tentar editar devolve 405.</text></g><g class="c" style="animation-delay:0.16s"><rect x="502" y="12" width="236" height="210" rx="12" fill="#161b22" stroke="#30363d" /><circle class="lampada" cx="540" cy="58" r="22" fill="#0d2447" style="animation-delay:0.8s"/><g transform="translate(528 46)"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" fill="none" stroke="#2f81f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="520" y="112" font-size="15.5" font-weight="700" fill="#e6edf3" text-anchor="start" >Cada um vê o seu</text><text x="520" y="138" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >O professor só vê o que registrou.</text><text x="520" y="159" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >Coordenação e direção veem tudo.</text></g><g class="c" style="animation-delay:0.24s"><rect x="749" y="12" width="236" height="210" rx="12" fill="#161b22" stroke="#30363d" /><circle class="lampada" cx="787" cy="58" r="22" fill="#0d2447" style="animation-delay:1.2s"/><g transform="translate(775 46)"><path d="M4 6h16M4 12h12M4 18h8" fill="none" stroke="#2f81f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="767" y="112" font-size="15.5" font-weight="700" fill="#e6edf3" text-anchor="start" >Pendências em ordem</text><text x="767" y="138" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >Fila por urgência, sem ficar</text><text x="767" y="159" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >caso perdido. A primeira vem</text><text x="767" y="180" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >marcada.</text></g><g class="c" style="animation-delay:0.32s"><rect x="8" y="238" width="236" height="210" rx="12" fill="#161b22" stroke="#30363d" /><circle class="lampada" cx="46" cy="284" r="22" fill="#0d2447" style="animation-delay:1.6s"/><g transform="translate(34 272)"><path d="M5 20V10M12 20V4M19 20v-7" fill="none" stroke="#2f81f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="26" y="338" font-size="15.5" font-weight="700" fill="#e6edf3" text-anchor="start" >Relatórios de verdade</text><text x="26" y="364" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >Gráficos por turma, mês e</text><text x="26" y="385" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >status, com filtros e planilha</text><text x="26" y="406" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >para baixar.</text></g><g class="c" style="animation-delay:0.40s"><rect x="255" y="238" width="236" height="210" rx="12" fill="#161b22" stroke="#30363d" /><circle class="lampada" cx="293" cy="284" r="22" fill="#0d2447" style="animation-delay:2.0s"/><g transform="translate(281 272)"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="none" stroke="#2f81f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="273" y="338" font-size="15.5" font-weight="700" fill="#e6edf3" text-anchor="start" >Estúdio de avatar</text><text x="273" y="364" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >Mais de 70 cabelos e 20 roupas,</text><text x="273" y="385" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >feitos aqui, sem enviar nada</text><text x="273" y="406" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >para terceiros.</text></g><g class="c" style="animation-delay:0.48s"><rect x="502" y="238" width="236" height="210" rx="12" fill="#161b22" stroke="#30363d" /><circle class="lampada" cx="540" cy="284" r="22" fill="#0d2447" style="animation-delay:2.4s"/><g transform="translate(528 272)"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5" fill="none" stroke="#2f81f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="520" y="338" font-size="15.5" font-weight="700" fill="#e6edf3" text-anchor="start" >Auditoria</text><text x="520" y="364" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >Login, criação, edição e mudança</text><text x="520" y="385" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >de status ficam registrados.</text></g><g class="c" style="animation-delay:0.56s"><rect x="749" y="238" width="236" height="210" rx="12" fill="#161b22" stroke="#30363d" /><circle class="lampada" cx="787" cy="284" r="22" fill="#0d2447" style="animation-delay:2.8s"/><g transform="translate(775 272)"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9 12h6" fill="none" stroke="#2f81f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="767" y="338" font-size="15.5" font-weight="700" fill="#e6edf3" text-anchor="start" >Custo zero</text><text x="767" y="364" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >Site na Vercel, API como função</text><text x="767" y="385" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >e banco no Supabase, tudo no</text><text x="767" y="406" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" >plano gratuito.</text></g></svg>