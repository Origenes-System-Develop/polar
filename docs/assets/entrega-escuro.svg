<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="254" viewBox="0 0 1000 254" role="img" aria-label="Entrega: site e API na Vercel, banco no Supabase, fluxo develop, release e master, e passo a passo dos deploys."><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.l{animation:entra .6s both}@keyframes entra{from{opacity:0;transform:translateX(-8px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style><rect x="0.5" y="0.5" width="999" height="245" rx="8" fill="#0d1117" stroke="#30363d" /><path d="M0.5 46V8.5a8 8 0 0 1 8-8H991.5a8 8 0 0 1 8 8V46z" fill="#161b22" stroke="#30363d"/><text x="20" y="29" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Item</text><text x="220" y="29" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Como é</text><g class="l" style="animation-delay:0.00s"><line x1="0.5" x2="999.5" y1="46" y2="46" stroke="#30363d"/><text x="20" y="76.0" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Site e API</text><text x="220" y="76.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >polarescolar.vercel.app, na Vercel, com uma prévia para cada pull request.</text></g><g class="l" style="animation-delay:0.07s"><line x1="0.5" x2="999.5" y1="96" y2="96" stroke="#30363d"/><rect x="1" y="97" width="998" height="49" fill="#161b22" opacity=".6"/><text x="20" y="126.0" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Banco</text><text x="220" y="126.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >PostgreSQL gratuito no Supabase.</text></g><g class="l" style="animation-delay:0.14s"><line x1="0.5" x2="999.5" y1="146" y2="146" stroke="#30363d"/><text x="20" y="176.0" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Fluxo</text><text x="220" y="176.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >develop, release e master. Mudança de banco entra pelo database/schema.sql antes da master.</text></g><g class="l" style="animation-delay:0.21s"><line x1="0.5" x2="999.5" y1="196" y2="196" stroke="#30363d"/><rect x="1" y="197" width="998" height="49" fill="#161b22" opacity=".6"/><text x="20" y="226.0" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start" >Passo a passo</text><text x="220" y="226.0" font-size="16" font-weight="400" fill="#e6edf3" text-anchor="start" >docs/deploy/supabase.md (banco, primeiro) e docs/deploy/vercel.md (aplicação).</text></g></svg>