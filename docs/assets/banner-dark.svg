<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Polar: ocorrências escolares, do registro ao encerramento">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
  .arco{stroke-dasharray:1;stroke-dashoffset:1;animation:desenha 1.4s .2s cubic-bezier(.2,.7,.2,1) forwards}
  .a2{animation-delay:.6s}
  .estrela{transform-box:fill-box;transform-origin:center;animation:pulsa 3.6s 1.6s ease-in-out infinite}
  .titulo{animation:sobe .8s .5s both} .sub{animation:sobe .8s .8s both} .chip{animation:sobe .8s both}
  .viaja{animation:viaja 9s 2s linear infinite}
  @keyframes desenha{to{stroke-dashoffset:0}}
  @keyframes pulsa{50%{transform:scale(1.18)}}
  @keyframes sobe{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes viaja{0%{transform:translateX(0)}100%{transform:translateX(588px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}}
</style>
<rect x=".5" y=".5" width="1279" height="299" rx="14" fill="#0d1117" stroke="#30363d"/>
<circle cx="1140" cy="40" r="170" fill="#2f81f7" opacity=".06"/>
<circle cx="1240" cy="260" r="120" fill="#2f81f7" opacity=".05"/>

<g transform="translate(96 70) scale(3.6)" fill="none" stroke="#2f81f7" stroke-width="3.4" stroke-linecap="round">
  <path class="arco a1" pathLength="1" d="M38.74 37.32 A18 18 0 0 1 9.26 37.32"/>
  <path class="arco a2" pathLength="1" d="M4.34 13.23 A24 24 0 0 1 43.66 13.23"/>
  <path class="estrela" stroke="none" fill="#2f81f7" d="M24 14 L25.94 20.65 L32.66 19 L27.87 24 L32.66 29 L25.94 27.35 L24 34 L22.07 27.35 L15.34 29 L20.13 24 L15.34 19 L22.06 20.65 Z"/>
</g>
<g class="titulo"><text x="300" y="132" font-size="68" font-weight="700" fill="#e6edf3" letter-spacing="-1.5">Polar</text></g>
<g class="sub"><text x="302" y="170" font-size="21" fill="#848d97">Ocorrências escolares do registro ao encerramento,</text>
<text x="302" y="198" font-size="21" fill="#848d97">com histórico que ninguém apaga.</text></g>
<g transform="translate(300 226)">
  <line x1="42" y1="16" x2="630" y2="16" stroke="#30363d" stroke-width="2"/>
  <g class="chip" style="animation-delay:1.1s"><rect width="132" height="32" rx="16" fill="#0d2240" stroke="#2f81f7" stroke-opacity=".4"/><text x="66" y="21" font-size="13.5" font-weight="600" text-anchor="middle" fill="#2f81f7">REGISTRADA</text></g>
  <g transform="translate(152 0)"><g class="chip" style="animation-delay:1.25s"><rect width="132" height="32" rx="16" fill="#3a2a06" stroke="#d29922" stroke-opacity=".4"/><text x="66" y="21" font-size="13.5" font-weight="600" text-anchor="middle" fill="#d29922">EM ANÁLISE</text></g></g>
  <g transform="translate(304 0)"><g class="chip" style="animation-delay:1.4s"><rect width="132" height="32" rx="16" fill="#0f2d1a" stroke="#3fb950" stroke-opacity=".4"/><text x="66" y="21" font-size="13.5" font-weight="600" text-anchor="middle" fill="#3fb950">RESOLVIDA</text></g></g>
  <g transform="translate(456 0)"><g class="chip" style="animation-delay:1.55s"><rect width="132" height="32" rx="16" fill="#271a45" stroke="#a371f7" stroke-opacity=".4"/><text x="66" y="21" font-size="13.5" font-weight="600" text-anchor="middle" fill="#a371f7">ENCERRADA</text></g></g>
</g>
</svg>
